<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffe38a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>פתקים</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf0;color:#24221b;font:17px Arial}main{max-width:750px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between}h1{margin:10px 0;font-size:29px}button,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px;background:#eee9dc;cursor:pointer}button.primary{background:#ffdc63;font-weight:bold}input,textarea{width:100%;border:1px solid #ded6c5;border-radius:10px;padding:12px;background:white;margin:8px 0}textarea{min-height:40vh;resize:vertical}article{background:#fff0b9;border-radius:12px;padding:15px;margin:9px 0;cursor:pointer;overflow-wrap:anywhere}article p{white-space:pre-wrap;margin:8px 0;max-height:4em;overflow:hidden}small{color:#666}nav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}[hidden]{display:none!important}.noteLine{display:block;width:100%;min-height:32px;height:32px;overflow:hidden;resize:none;border:0;border-radius:0;margin:0;padding:5px 2px;line-height:1.4;background:transparent;outline:none;touch-action:manipulation}.noteLine.marked{border-bottom:2px solid #555;padding-bottom:12px;margin-bottom:10px;text-decoration:none}article{touch-action:pan-y}.swipeRow{position:relative;overflow:hidden;border-radius:12px}.swipeActions{display:flex;gap:8px;margin:0 0 8px}.swipeActions button{flex:1;font-weight:bold}.swipeDelete{background:#c62828;color:white}.swipeEdit{background:#1769d2;color:white}.swipeRow{display:flex;align-items:flex-start;gap:8px}.swipeRow .noteLine{flex:1;min-width:0}.topicCheck{appearance:none;-webkit-appearance:none;flex:0 0 25px;width:25px;height:25px;margin:9px 0 0;padding:0;border:2px solid #ba2424;border-radius:5px;background:#d32f2f;display:grid;place-items:center;cursor:pointer}.topicCheck:checked{background:#16803c;border-color:#16803c}.topicCheck:checked:after{content:"✓";color:white;font-size:19px;font-weight:bold}.inkPad{width:100%;height:auto;aspect-ratio:1;max-height:55vh;background:white;border:1px solid #ccc;touch-action:none;border-radius:8px}.inkDialog{width:min(96%,750px);border:0;border-radius:12px;padding:12px;background:#fffaf0}.inkDialog::backdrop{background:#0008}.inkPreview{width:100%;max-height:260px;object-fit:contain;border:1px solid #ddd;background:white}</style><main><header><h1>📝 פתקים</h1><button id="add" class="primary">＋ פתק חדש</button><button id="inkOpen" aria-label="כתב יד ושרטוט" style="margin-right:auto;background:transparent;padding:5px">✍️</button><button id="settings" aria-label="הגדרות" aria-expanded="false" style="font-size:21px;padding:5px 9px;background:transparent">⚙</button></header><small id="status">שמירה במכשיר</small><small> · גרסה 13</small><section id="home"><input id="search" placeholder="חיפוש בפתקים"><nav id="settingsPanel" hidden><button id="login">חיבור Ofer Cloud</button><button id="backup">גיבוי</button><button id="restore">שחזור</button><button id="update">בדוק עדכון</button></nav><div id="list"></div></section><section id="editor" hidden><nav><button id="back">חזרה</button><button id="pin">נעיצה</button><button id="share">שיתוף</button><button id="del">מחיקה</button></nav><input id="title" placeholder="כותרת"><textarea id="body" hidden></textarea><div id="lines" style="background:white;border:1px solid #ded6c5;border-radius:10px;padding:10px;min-height:40vh;margin:8px 0"></div><small>הקשה כפולה על הטקסט יוצרת קו הפרדה ושדה כתיבה חדש מתחתיו</small><small id="saved"></small></section><input type="file" id="file" accept=".json" hidden><div id="inkList"></div><dialog id="inkDialog" class="inkDialog"><strong>כתב יד ושרטוט</strong><nav><button id="undoInk">בטל קו</button><button id="clearInk">נקה</button></nav><small>שרטט באופן חופשי. קווים וצורות מתחברים אוטומטית; אפשר לבטל תיקון באמצעות בטל קו.</small><canvas id="inkCanvas" class="inkPad" width="900" height="900"></canvas><nav><button id="saveInk" class="primary">שמור בפתק</button><button id="closeInk">סגור</button></nav></dialog></main><script>
const $=id=>document.getElementById(id),key='ofer-notes-v1';let notes={},active=null;try{notes=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){$('status').textContent='שגיאה בקריאת הנתונים'}
function persist(){try{localStorage.setItem(key,JSON.stringify(notes));$('saved').textContent='✓ נשמר במכשיר';return true}catch(e){$('status').textContent='שגיאת שמירה במכשיר';return false}}
function swipe(el,left,right){let x=0,y=0,blocked=false;el.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('.topicCheck')){x=NaN;y=NaN;return;}x=e.touches[0].clientX;y=e.touches[0].clientY;blocked=false},{passive:true});el.addEventListener('touchend',e=>{const p=e.changedTouches[0];if(!p)return;const dx=p.clientX-x,dy=p.clientY-y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){blocked=true;dx<0?left():right()}},{passive:true});el.addEventListener('click',e=>{if(blocked){e.preventDefault();e.stopImmediatePropagation();blocked=false}},true)}
function render(){const q=$('search').value.toLowerCase();$('list').replaceChildren();const rows=Object.values(notes).filter(n=>!n.deleted&&(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updated-a.updated);for(const n of rows){const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),d=document.createElement('small');h.textContent=(n.pinned?'📌 ':'')+(n.title||'ללא כותרת');p.textContent=n.body;d.textContent=new Date(n.updated).toLocaleString('he-IL');a.append(h,p,d);a.onclick=()=>openNote(n.id);swipe(a,()=>{if(confirm('למחוק את הפתק?')){notes[n.id].deleted=true;notes[n.id].pending=true;notes[n.id].updated=Date.now();persist();window.queueSync?.();render()}},()=>openNote(n.id));$('list').append(a)}if(!rows.length)$('list').textContent='אין פתקים להצגה'}
function openNote(id){active=id;const n=notes[id];$('title').value=n.title;$('body').value=n.body;drawLines(n);renderInk();$('pin').textContent=n.pinned?'בטל נעיצה':'נעיצה';$('home').hidden=true;$('editor').hidden=false}
function drawLines(n,focus=-1,pos=0){const box=$('lines');box.replaceChildren();const lines=Array.isArray(n.sections)?n.sections.slice():n.body.split('\n');const marks=new Set(n.underlined||[]);if(marks.has(lines.length-1))lines.push('');$('body').value=lines.join('\n');let fields=[];function sync(){notes[active].sections=fields.map(t=>t.value);$('body').value=notes[active].sections.join('\n');change()}function append(value,marked=false){const i=fields.length,t=document.createElement('textarea');fields.push(t);t.className='noteLine';t.rows=1;t.value=value;t.placeholder='המשך לכתוב כאן...';t.style.minHeight='44px';t.style.fontSize='17px';t.style.touchAction='auto';const row=document.createElement('div');row.className='swipeRow';row.append(t);const check=document.createElement('input');check.type='checkbox';check.className='topicCheck';check.setAttribute('aria-label','סמן נושא כבוצע');check.hidden=!marked;check.checked=(n.completed||[]).includes(i);check.onchange=()=>{const a=notes[active];const done=new Set(a.completed||[]);check.checked?done.add(i):done.delete(i);a.completed=[...done];sync()};row.append(check);box.append(row);const hr=document.createElement('hr');hr.style.cssText='border:0;border-top:2px solid #555;margin:8px 0 12px;width:100%';hr.hidden=!marked;box.append(hr);const resize=()=>{t.style.height='auto';t.style.height=Math.max(44,t.scrollHeight)+'px'};resize();t.oninput=()=>{resize();sync()};swipe(row,()=>{if(!confirm('למחוק רשומה זו בלבד?'))return;const a=notes[active],arr=fields.map(f=>f.value);arr.splice(i,1);if(!arr.length)arr.push('');a.sections=arr;a.underlined=(a.underlined||[]).filter(k=>k!==i).map(k=>k>i?k-1:k);a.completed=(a.completed||[]).filter(k=>k!==i).map(k=>k>i?k-1:k);$('body').value=arr.join('\n');change();drawLines(a)},()=>{t.focus();t.setSelectionRange(t.value.length,t.value.length)});let last=0,handled=0,tx=0,ty=0;t.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});function toggle(){if(Date.now()-handled<500)return;handled=Date.now();const a=notes[active];if(!a)return;const set=new Set(a.underlined||[]);if(set.has(i)){set.delete(i);hr.hidden=true;check.hidden=true;check.checked=false;a.completed=(a.completed||[]).filter(k=>k!==i)}else{set.add(i);hr.hidden=false;check.hidden=false;if(i===fields.length-1)append('',false);const next=fields[i+1];next.focus();next.setSelectionRange(0,0)}a.underlined=[...set];sync()}t.addEventListener('touchend',e=>{if(Math.abs(e.changedTouches[0].clientX-tx)>20||Math.abs(e.changedTouches[0].clientY-ty)>20){last=0;return}const now=Date.now();if(now-last<350){e.preventDefault();last=0;toggle()}else last=now},{passive:false});t.addEventListener('dblclick',e=>{e.preventDefault();toggle()});return t}lines.forEach((line,i)=>append(line,marks.has(i)));if(focus>=0&&fields[focus]){fields[focus].focus();fields[focus].setSelectionRange(pos,pos)}}
function change(){if(!active)return;Object.assign(notes[active],{title:$('title').value,body:$('body').value,updated:Date.now(),pending:true});if(persist())window.queueSync?.()}
$('title').oninput=$('body').oninput=change;$('add').onclick=()=>{const id=crypto.randomUUID();notes[id]={id,title:'',body:'',updated:Date.now(),pinned:false,pending:true};persist();openNote(id);$('title').focus();window.queueSync?.()};$('back').onclick=()=>{active=null;renderInk();$('editor').hidden=true;$('home').hidden=false;render()};$('pin').onclick=()=>{notes[active].pinned=!notes[active].pinned;$('pin').textContent=notes[active].pinned?'בטל נעיצה':'נעיצה';change()};$('del').onclick=()=>{if(confirm('למחוק את הפתק?')){notes[active].deleted=true;change();$('back').click()}};$('settings').onclick=()=>{if($('home').hidden)$('back').click();const p=$('settingsPanel');p.hidden=!p.hidden;$('settings').setAttribute('aria-expanded',String(!p.hidden))};$('search').oninput=render;$('share').onclick=async()=>{const text=$('title').value+'\n'+$('body').value;try{if(navigator.share)await navigator.share({text});else await navigator.clipboard.writeText(text)}catch(e){}};$('backup').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(notes)],{type:'application/json'}));a.download='notes-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const obj=JSON.parse(await $('file').files[0].text());if(!obj||typeof obj!=='object'||Array.isArray(obj)||!Object.values(obj).every(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&typeof n.body==='string'&&Number.isFinite(n.updated)))throw Error();for(const n of Object.values(obj)){if(!notes[n.id]||notes[n.id].updated<n.updated)notes[n.id]={...n,pending:true}}persist();render();window.queueSync?.()}catch(e){alert('קובץ גיבוי לא תקין')}};$('update').onclick=async()=>{try{if(!navigator.onLine)throw Error();const r=await navigator.serviceWorker.getRegistration();await r?.update();location.reload()}catch(e){alert('יש להתחבר לאינטרנט לעדכון')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{$('status').textContent='התקנת מצב לא מקוון נכשלה'});render();
window.notesBridge={get:()=>notes,merge:n=>{const old=notes[n.id];if(!old||(!old.pending&&n.updated>=old.updated)||n.updated>old.updated){if(active===n.id&&old?.pending)return;notes[n.id]={...n,pending:false};persist();render();if(active===n.id&&!n.deleted)openNote(n.id)}},ack:(id,t)=>{if(notes[id]?.updated===t){notes[id].pending=false;persist()}},status:t=>$('status').textContent=t};
$('login').onclick=()=>{if(!navigator.onLine){alert('חיבור ראשוני לענן מצריך אינטרנט');return}import('./cloud.js').then(m=>m.login()).catch(()=>{$('status').textContent='לא ניתן להתחבר לענן'})};if(navigator.onLine)import('./cloud.js').catch(()=>{});window.addEventListener('online',()=>import('./cloud.js').then(()=>window.queueSync?.()).catch(()=>{}));window.addEventListener('offline',()=>$('status').textContent='לא מקוון • שמירה במכשיר');

let inkMode='shape', strokes=[], current=null;
const canvas=$('inkCanvas'),ctx=canvas.getContext('2d');
function renderInk(){const box=$('inkList');box.replaceChildren();if(!active)return;for(const [i,st] of (notes[active].ink||[]).entries()){const img=document.createElement('canvas');img.width=900;img.height=900;img.className='inkPreview';paint(img.getContext('2d'),st);const b=document.createElement('button');b.textContent='מחק שרטוט';b.onclick=()=>{if(confirm('למחוק את השרטוט?')){notes[active].ink.splice(i,1);change();renderInk()}};box.append(img,b)}}
function paint(c,ss){c.clearRect(0,0,900,900);c.strokeStyle='#222';c.lineWidth=4;c.lineCap='round';c.lineJoin='round';for(const p of ss){if(!p.length)continue;c.beginPath();c.moveTo(p[0][0],p[0][1]);for(const q of p.slice(1))c.lineTo(q[0],q[1]);if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()}}
function redrawInk(){paint(ctx,current?[...strokes,current]:strokes)}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function simplify(p,e){if(p.length<3)return p;const a=p[0],b=p.at(-1),dx=b[0]-a[0],dy=b[1]-a[1];let max=0,j=0;for(let i=1;i<p.length-1;i++){const q=p[i],t=Math.max(0,Math.min(1,((q[0]-a[0])*dx+(q[1]-a[1])*dy)/(dx*dx+dy*dy||1))),d=dist(q,[a[0]+t*dx,a[1]+t*dy]);if(d>max){max=d;j=i}}return max>e?[...simplify(p.slice(0,j+1),e).slice(0,-1),...simplify(p.slice(j),e)]:[a,b]}
function smart(p){if(p.length<2)return [p];const a=p[0],b=p.at(-1),xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y,d=Math.hypot(w,h);if(d<12)return [p];if(['cylinder','cone','pyramid'].includes(inkMode))return solidShape(inkMode,x,y,w,h);if(inkMode==='cube'){const z=Math.min(w,h)*.22,W=w-z,H=h-z,A=[x,y+z],B=[x+W,y+z],C=[x+W,y+z+H],D=[x,y+z+H],E=[x+z,y],F=[x+W+z,y],G=[x+W+z,y+H];return [[A,B,C,D,A],[A,E,F,B],[F,G,C]]}if(dist(a,b)<d*.32&&w>25&&h>25){const q=simplify([...p.slice(0,-1),a],d*.085);if(q.length===4)return [[...q]];if(q.length===5){if(Math.abs(w-h)<Math.max(w,h)*.2){const k=(w+h)/2;return [[[x,y],[x+k,y],[x+k,y+k],[x,y+k],[x,y]]]}return [[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]]]}const ellipse=Array.from({length:65},(_,i)=>[x+w/2+w/2*Math.cos(i*Math.PI/32),y+h/2+h/2*Math.sin(i*Math.PI/32)]);return [ellipse]}const q=simplify(p,d*.06);if(q.length===2){let end=b.slice();if(Math.abs(b[0]-a[0])<Math.abs(b[1]-a[1])*.18)end[0]=a[0];if(Math.abs(b[1]-a[1])<Math.abs(b[0]-a[0])*.18)end[1]=a[1];return [[a,end]]}return [q]}
function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*900/r.width,(e.clientY-r.top)*900/r.height]}
canvas.onpointerdown=e=>{if(current)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);current=[point(e)];inkStart=Date.now();inkMove=inkStart;redrawInk()};canvas.onpointermove=e=>{if(!current||!canvas.hasPointerCapture(e.pointerId))return;const q=point(e);if(dist(q,current.at(-1))>4)inkMove=Date.now();current.push(q);redrawInk()};canvas.onpointerup=e=>{if(!current||!canvas.hasPointerCapture(e.pointerId))return;current.push(point(e));historyInk.push(strokes.slice());const added=autoInk(current,Date.now()-inkMove>420);if(added!==null){strokes.push(...added.map(p=>p.length===2?snapSegment(p):p));if(added.length===1&&added[0].length===2){completeCycle();completeDepth();completeRoundSolid()}}else strokes.push(current);current=null;redrawInk()};canvas.onpointercancel=()=>{current=null;redrawInk()};
$('undoInk').onclick=()=>{if(historyInk.length)strokes=historyInk.pop();else strokes.pop();redrawInk()};$('clearInk').onclick=()=>{strokes=[];historyInk=[];redrawInk()};$('inkOpen').onclick=()=>{document.activeElement?.blur();strokes=[];historyInk=[];redrawInk();$('inkDialog').showModal()};$('closeInk').onclick=()=>$('inkDialog').close();$('saveInk').onclick=()=>{if(!strokes.length)return;if(!active){const id=crypto.randomUUID();notes[id]={id,title:'כתב יד ושרטוט',body:'',updated:Date.now(),pinned:false,pending:true};openNote(id)}(notes[active].ink??=[]).push(strokes);change();renderInk();$('inkDialog').close()};

function ellipseArc(x,y,rx,ry,a=0,b=2*Math.PI){return Array.from({length:65},(_,i)=>[x+rx*Math.cos(a+(b-a)*i/64),y+ry*Math.sin(a+(b-a)*i/64)])}
function solidShape(m,x,y,w,h){if(w<20||h<20)return [[[x,y],[x+w,y+h]]];const rx=w/2,ry=Math.min(h*.16,w*.2),cx=x+rx,top=y+ry,bot=y+h-ry;if(m==='cylinder')return [ellipseArc(cx,top,rx,ry),[[x,top],[x,bot]],[[x+w,top],[x+w,bot]],ellipseArc(cx,bot,rx,ry,0,Math.PI)];if(m==='cone')return [ellipseArc(cx,bot,rx,ry),[[x,bot],[cx,y],[x+w,bot]]];const A=[x,y+h*.75],B=[x+w*.65,y+h],C=[x+w,y+h*.65],D=[x+w*.35,y+h*.4],P=[cx,y];return [[A,B,C,D,A],[A,P,B],[C,P,D]]}

let historyInk=[],inkStart=0,inkMove=0;
function snapSegment(line){const vertices=strokes.flatMap(p=>p.length<=5?p:[]);return line.map(a=>{let best=a,d=27;for(const b of vertices){const n=dist(a,b);if(n<d){best=b;d=n}}return best.slice()})}
function completeDepth(){
 for(let i=strokes.length-2;i>=0;i--){
 const p=strokes[i];if(![4,5].includes(p.length)||dist(p[0],p.at(-1))>3)continue;
 const v=p.slice(0,-1),size=Math.max(...v.map(a=>dist(a,v[0]))),tol=Math.max(20,Math.min(45,size*.15));if(size<50)continue;
 const rays=[];
 for(let j=i+1;j<strokes.length;j++){const l=strokes[j];if(l.length!==2)continue;let match=null;
 for(let k=0;k<v.length;k++)for(let end=0;end<2;end++){const a=l[end],b=l[1-end],d=dist(a,v[k]);if(d>tol||dist(b,v[k])<18)continue;const dx=b[0]-v[k][0],dy=b[1]-v[k][1];if(Math.abs(dx)<8||Math.abs(dy)<8)continue;if(!match||d<match.d)match={j,k,dx,dy,d}}
 if(match)rays.push(match);
 }
 const latest=rays.find(a=>a.j===strokes.length-1);if(!latest)continue;
 const similar=rays.filter(a=>{const dot=a.dx*latest.dx+a.dy*latest.dy,la=Math.hypot(a.dx,a.dy),lb=Math.hypot(latest.dx,latest.dy);return dot/(la*lb)>.88&&la/lb>.5&&la/lb<2});
 const unique=[...new Map(similar.map(a=>[a.k,a])).values()];if(unique.length<2)continue;
 const dx=unique.reduce((n,a)=>n+a.dx,0)/unique.length,dy=unique.reduce((n,a)=>n+a.dy,0)/unique.length;
 const back=v.map(a=>[a[0]+dx,a[1]+dy]);if(back.some(a=>a.some(n=>n<0||n>900)))continue;
 for(const a of similar)strokes[a.j]=[v[a.k],back[a.k]];
 if(unique.length===v.length)strokes.push([...back,back[0]]);
 return;
 }
}

function oldAutoInk(p,hold){
 const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]),w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys),d=Math.hypot(w,h);
 if(d<25||(!hold&&d<75))return null;
 const q=simplify(p,Math.max(4,d*.045)),closed=dist(p[0],p.at(-1))<d*.22;
 if(closed&&w>25&&h>25){
 const corners=simplify([...p.slice(0,-1),p[0]],d*.065);
 if(corners.length>=4&&corners.length<=7){if(corners.length===5){const v=corners.slice(0,-1),axis=v.every((a,i)=>{const b=v[(i+1)%4];return Math.min(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]))<d*.12});if(axis)return smart(p)}return [corners]}
 const cx=(Math.max(...xs)+Math.min(...xs))/2,cy=(Math.max(...ys)+Math.min(...ys))/2,rx=w/2,ry=h/2;
 const error=p.reduce((n,a)=>n+Math.abs(Math.hypot((a[0]-cx)/rx,(a[1]-cy)/ry)-1),0)/p.length;
 if(error<.18)return [ellipseArc(cx,cy,rx,ry)];
 }
 if(q.length===2)return smart(p);
 if(hold)return [q];
 return null;
}
function oldCompleteCycle(){const n=strokes.length;for(const count of [4,3]){if(n<count)continue;const lines=strokes.slice(-count);if(lines.some(p=>p.length!==2))continue;const v=[...lines[0]];let ok=true;for(const l of lines.slice(1)){const a=v.at(-1);if(dist(a,l[0])<28)v.push(l[1]);else if(dist(a,l[1])<28)v.push(l[0]);else{ok=false;break}}if(ok&&dist(v[0],v.at(-1))<28){v[v.length-1]=v[0];if(Math.max(...v.map(a=>dist(a,v[0])))>75)strokes.splice(n-count,count,...smart(v));return}}}
function completeRoundSolid(){const n=strokes.length;if(n<3)return;const p=strokes[n-3],a=strokes[n-2],b=strokes[n-1];if(p.length<30||a.length!==2||b.length!==2)return;const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y,c=[x+w/2,y+h/2],L=[x,c[1]],R=[x+w,c[1]];if(w<50||h>w*.65)return;
 function orient(l,at){return dist(l[0],at)<dist(l[1],at)?l:[l[1],l[0]]}
 let l=orient(a,L),r=orient(b,R);if(dist(l[0],L)+dist(r[0],R)>dist(orient(b,L)[0],L)+dist(orient(a,R)[0],R)){l=orient(b,L);r=orient(a,R)}
 if(dist(l[0],L)>35||dist(r[0],R)>35)return;
 if(dist(l[1],r[1])<35){const tip=[(l[1][0]+r[1][0])/2,(l[1][1]+r[1][1])/2];strokes.splice(n-2,2,[L,tip],[R,tip]);return}
 const dy=((l[1][1]-L[1])+(r[1][1]-R[1]))/2;if(Math.abs(dy)<45||Math.abs(l[1][0]-L[0])>35||Math.abs(r[1][0]-R[0])>35||Math.abs(l[1][1]-r[1][1])>45)return;strokes.splice(n-2,2,[L,[L[0],L[1]+dy]],[R,[R[0],R[1]+dy]],ellipseArc(c[0],c[1]+dy,w/2,h/2,0,Math.PI));
}

function boundsInk(p){const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]);return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}
function polygonFit(v){
 if(v.length===4){const c=[v.reduce((s,a)=>s+a[0],0)/4,v.reduce((s,a)=>s+a[1],0)/4];let u=[(v[1][0]-v[0][0]+v[2][0]-v[3][0])/2,(v[1][1]-v[0][1]+v[2][1]-v[3][1])/2],t=[(v[3][0]-v[0][0]+v[2][0]-v[1][0])/2,(v[3][1]-v[0][1]+v[2][1]-v[1][1])/2];let a=Math.hypot(...u),b=Math.hypot(...t);if(a>15&&b>15&&Math.abs((u[0]*t[0]+u[1]*t[1])/(a*b))<.42){let angle=Math.atan2(u[1],u[0]);const axis=Math.round(angle/(Math.PI/2))*Math.PI/2;if(Math.abs(angle-axis)<.18)angle=axis;if(Math.abs(a-b)/Math.max(a,b)<.16)a=b=(a+b)/2;u=[Math.cos(angle)*a,Math.sin(angle)*a];const sign=u[0]*t[1]-u[1]*t[0]>0?1:-1;t=[-Math.sin(angle)*b*sign,Math.cos(angle)*b*sign];v=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([i,j])=>[c[0]+(i*u[0]+j*t[0])/2,c[1]+(i*u[1]+j*t[1])/2])}}
 return [...v,v[0]];
}
function autoInk(p,hold){
 const {x,y,w,h}=boundsInk(p),d=Math.hypot(w,h);if(d<16)return null;
 const len=p.slice(1).reduce((n,a,i)=>n+dist(a,p[i]),0),end=dist(p[0],p.at(-1)),near=strokes.some(s=>s.some(a=>dist(a,p[0])<42||dist(a,p.at(-1))<42));
 const q=simplify(p,Math.max(5,d*.085));
 if(end>d*.65&&len<end*1.4&&q.length<=3&&(d>38||near||hold)){let a=p[0].slice(),b=p.at(-1).slice();const dx=b[0]-a[0],dy=b[1]-a[1];if(Math.abs(dx)<Math.abs(dy)*.2)b[0]=a[0];if(Math.abs(dy)<Math.abs(dx)*.2)b[1]=a[1];return [[a,b]]}
 if(end<d*.33&&w>22&&h>22&&(d>45||hold)){
 const closed=[...p,p[0]],cx=x+w/2,cy=y+h/2,rx=w/2,ry=h/2;
 const err=p.reduce((n,a)=>n+Math.abs(Math.hypot((a[0]-cx)/rx,(a[1]-cy)/ry)-1),0)/p.length;
 const raw=simplify(closed,d*.075),v=raw.slice(0,-1);
 if(err<.13&&v.length>=5)return [ellipseArc(cx,cy,rx,ry)];
 if(v.length>=3&&v.length<=6)return [polygonFit(v)];
 if(err<.23)return [ellipseArc(cx,cy,rx,ry)];
 }
 if(hold&&q.length<=5)return [q];return null;
}
function completeCycle(){
 const n=strokes.length;if(n<3||strokes[n-1].length!==2)return;
 const last=n-1, candidates=[];for(let i=Math.max(0,n-12);i<last;i++)if(strokes[i].length===2)candidates.push(i);
 const a=strokes[last];function walk(v,used){if(used.length>=3&&dist(v[0],v.at(-1))<36){const b=boundsInk(v);if(Math.min(b.w,b.h)>25)return {v:v.slice(0,-1),used};}if(used.length===4)return null;for(const i of candidates){if(used.includes(i))continue;const l=strokes[i];for(let k=0;k<2;k++)if(dist(v.at(-1),l[k])<36){const out=walk([...v,l[1-k]],[...used,i]);if(out)return out}}return null}
 const found=walk(a,[last]);if(!found)return;strokes=strokes.filter((_,i)=>!found.used.includes(i));strokes.push(polygonFit(found.v));
}
