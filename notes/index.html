<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffe38a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>פתקים</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf0;color:#24221b;font:17px Arial}main{max-width:750px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between}h1{margin:10px 0;font-size:29px}button,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px;background:#eee9dc;cursor:pointer}button.primary{background:#ffdc63;font-weight:bold}input,textarea{width:100%;border:1px solid #ded6c5;border-radius:10px;padding:12px;background:white;margin:8px 0}textarea{min-height:40vh;resize:vertical}article{background:#fff0b9;border-radius:12px;padding:15px;margin:9px 0;cursor:pointer;overflow-wrap:anywhere}article p{white-space:pre-wrap;margin:8px 0;max-height:4em;overflow:hidden}small{color:#666}nav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}[hidden]{display:none!important}.noteLine{display:block;width:100%;min-height:32px;height:32px;overflow:hidden;resize:none;border:0;border-radius:0;margin:0;padding:5px 2px;line-height:1.4;background:transparent;outline:none;touch-action:manipulation}.noteLine.marked{border-bottom:2px solid #555;padding-bottom:12px;margin-bottom:10px;text-decoration:none}article{touch-action:pan-y}.swipeRow{position:relative;overflow:hidden;border-radius:12px}.swipeActions{display:flex;gap:8px;margin:0 0 8px}.swipeActions button{flex:1;font-weight:bold}.swipeDelete{background:#c62828;color:white}.swipeEdit{background:#1769d2;color:white}.swipeRow{display:flex;align-items:flex-start;gap:8px}.swipeRow .noteLine{flex:1;min-width:0}.topicCheck{appearance:none;-webkit-appearance:none;flex:0 0 25px;width:25px;height:25px;margin:9px 0 0;padding:0;border:2px solid #ba2424;border-radius:5px;background:#d32f2f;display:grid;place-items:center;cursor:pointer}.topicCheck:checked{background:#16803c;border-color:#16803c}.topicCheck:checked:after{content:"✓";color:white;font-size:19px;font-weight:bold}.inkPad{display:block;width:100%;height:100%;min-height:0;flex:1;background:white;touch-action:none;border:0;border-radius:0}.inkDialog{position:fixed;inset:0;margin:0;width:100%;height:100%;height:100dvh;max-width:none;max-height:none;border:0;border-radius:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:white;overflow:hidden}.inkDialog[open]{display:flex;flex-direction:column}.inkDialog strong,.inkDialog small{padding:4px 10px}.inkDialog nav{margin:4px 8px;flex:none}.inkDialog .inkCanvasWrap{flex:1;min-height:0;position:relative;overflow:hidden}.inkDialog .inkPad{position:absolute;inset:0}.inkDialog::backdrop{background:#0008}.inkPreview{width:100%;max-height:260px;object-fit:contain;border:1px solid #ddd;background:white}</style><main><header><h1>📝 פתקים</h1><button id="add" class="primary">＋ פתק חדש</button><button id="inkOpen" aria-label="כתב יד ושרטוט" style="margin-right:auto;background:transparent;padding:5px">✍️</button><button id="settings" aria-label="הגדרות" aria-expanded="false" style="font-size:21px;padding:5px 9px;background:transparent">⚙</button></header><small id="status">שמירה במכשיר</small><small> · גרסה 16</small><section id="home"><input id="search" placeholder="חיפוש בפתקים"><nav id="settingsPanel" hidden><button id="login">חיבור Ofer Cloud</button><button id="backup">גיבוי</button><button id="restore">שחזור</button><button id="update">בדוק עדכון</button></nav><div id="list"></div></section><section id="editor" hidden><nav><button id="back">חזרה</button><button id="pin">נעיצה</button><button id="share">שיתוף</button><button id="del">מחיקה</button></nav><input id="title" placeholder="כותרת"><textarea id="body" hidden></textarea><div id="lines" style="background:white;border:1px solid #ded6c5;border-radius:10px;padding:10px;min-height:40vh;margin:8px 0"></div><small>הקשה כפולה על הטקסט יוצרת קו הפרדה ושדה כתיבה חדש מתחתיו</small><small id="saved"></small></section><input type="file" id="file" accept=".json" hidden><div id="inkList"></div><dialog id="inkDialog" class="inkDialog"><strong>כתב יד ושרטוט</strong><nav><button id="undoInk">בטל קו</button><button id="clearInk">נקה</button></nav><small>שרטט באופן חופשי. בסיום הקש פעמיים על משטח השרטוט ליישור הקווים.</small><div class="inkCanvasWrap"><canvas id="inkCanvas" class="inkPad" width="900" height="900"></canvas></div><nav><button id="saveInk" class="primary">שמור בפתק</button><button id="closeInk">סגור</button></nav></dialog></main><script>
const $=id=>document.getElementById(id),key='ofer-notes-v1';let notes={},active=null;try{notes=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){$('status').textContent='שגיאה בקריאת הנתונים'}
function persist(){try{localStorage.setItem(key,JSON.stringify(notes));$('saved').textContent='✓ נשמר במכשיר';return true}catch(e){$('status').textContent='שגיאת שמירה במכשיר';return false}}
function swipe(el,left,right){let x=0,y=0,blocked=false;el.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('.topicCheck')){x=NaN;y=NaN;return;}x=e.touches[0].clientX;y=e.touches[0].clientY;blocked=false},{passive:true});el.addEventListener('touchend',e=>{const p=e.changedTouches[0];if(!p)return;const dx=p.clientX-x,dy=p.clientY-y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){blocked=true;dx<0?left():right()}},{passive:true});el.addEventListener('click',e=>{if(blocked){e.preventDefault();e.stopImmediatePropagation();blocked=false}},true)}
function render(){const q=$('search').value.toLowerCase();$('list').replaceChildren();const rows=Object.values(notes).filter(n=>!n.deleted&&(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updated-a.updated);for(const n of rows){const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),d=document.createElement('small');h.textContent=(n.pinned?'📌 ':'')+(n.title||'ללא כותרת');p.textContent=n.body;d.textContent=new Date(n.updated).toLocaleString('he-IL');a.append(h,p,d);a.onclick=()=>openNote(n.id);swipe(a,()=>{if(confirm('למחוק את הפתק?')){notes[n.id].deleted=true;notes[n.id].pending=true;notes[n.id].updated=Date.now();persist();window.queueSync?.();render()}},()=>openNote(n.id));$('list').append(a)}if(!rows.length)$('list').textContent='אין פתקים להצגה'}
function openNote(id){active=id;const n=notes[id];$('title').value=n.title;$('body').value=n.body;drawLines(n);renderInk();$('pin').textContent=n.pinned?'בטל נעיצה':'נעיצה';$('home').hidden=true;$('editor').hidden=false}
function drawLines(n,focus=-1,pos=0){const box=$('lines');box.replaceChildren();const lines=Array.isArray(n.sections)?n.sections.slice():n.body.split('\n');const marks=new Set(n.underlined||[]);if(marks.has(lines.length-1))lines.push('');$('body').value=lines.join('\n');let fields=[];function sync(){notes[active].sections=fields.map(t=>t.value);$('body').value=notes[active].sections.join('\n');change()}function append(value,marked=false){const i=fields.length,t=document.createElement('textarea');fields.push(t);t.className='noteLine';t.rows=1;t.value=value;t.placeholder='המשך לכתוב כאן...';t.style.minHeight='44px';t.style.fontSize='17px';t.style.touchAction='auto';const row=document.createElement('div');row.className='swipeRow';row.append(t);const check=document.createElement('input');check.type='checkbox';check.className='topicCheck';check.setAttribute('aria-label','סמן נושא כבוצע');check.hidden=!marked;check.checked=(n.completed||[]).includes(i);check.onchange=()=>{const a=notes[active];const done=new Set(a.completed||[]);check.checked?done.add(i):done.delete(i);a.completed=[...done];sync()};row.append(check);box.append(row);const hr=document.createElement('hr');hr.style.cssText='border:0;border-top:2px solid #555;margin:8px 0 12px;width:100%';hr.hidden=!marked;box.append(hr);const resize=()=>{t.style.height='auto';t.style.height=Math.max(44,t.scrollHeight)+'px'};resize();t.oninput=()=>{resize();sync()};swipe(row,()=>{if(!confirm('למחוק רשומה זו בלבד?'))return;const a=notes[active],arr=fields.map(f=>f.value);arr.splice(i,1);if(!arr.length)arr.push('');a.sections=arr;a.underlined=(a.underlined||[]).filter(k=>k!==i).map(k=>k>i?k-1:k);a.completed=(a.completed||[]).filter(k=>k!==i).map(k=>k>i?k-1:k);$('body').value=arr.join('\n');change();drawLines(a)},()=>{t.focus();t.setSelectionRange(t.value.length,t.value.length)});let last=0,handled=0,tx=0,ty=0;t.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});function toggle(){if(Date.now()-handled<500)return;handled=Date.now();const a=notes[active];if(!a)return;const set=new Set(a.underlined||[]);if(set.has(i)){set.delete(i);hr.hidden=true;check.hidden=true;check.checked=false;a.completed=(a.completed||[]).filter(k=>k!==i)}else{set.add(i);hr.hidden=false;check.hidden=false;if(i===fields.length-1)append('',false);const next=fields[i+1];next.focus();next.setSelectionRange(0,0)}a.underlined=[...set];sync()}t.addEventListener('touchend',e=>{if(Math.abs(e.changedTouches[0].clientX-tx)>20||Math.abs(e.changedTouches[0].clientY-ty)>20){last=0;return}const now=Date.now();if(now-last<350){e.preventDefault();last=0;toggle()}else last=now},{passive:false});t.addEventListener('dblclick',e=>{e.preventDefault();toggle()});return t}lines.forEach((line,i)=>append(line,marks.has(i)));if(focus>=0&&fields[focus]){fields[focus].focus();fields[focus].setSelectionRange(pos,pos)}}
function change(){if(!active)return;Object.assign(notes[active],{title:$('title').value,body:$('body').value,updated:Date.now(),pending:true});if(persist())window.queueSync?.()}
$('title').oninput=$('body').oninput=change;$('add').onclick=()=>{const id=crypto.randomUUID();notes[id]={id,title:'',body:'',updated:Date.now(),pinned:false,pending:true};persist();openNote(id);$('title').focus();window.queueSync?.()};$('back').onclick=()=>{active=null;renderInk();$('editor').hidden=true;$('home').hidden=false;render()};$('pin').onclick=()=>{notes[active].pinned=!notes[active].pinned;$('pin').textContent=notes[active].pinned?'בטל נעיצה':'נעיצה';change()};$('del').onclick=()=>{if(confirm('למחוק את הפתק?')){notes[active].deleted=true;change();$('back').click()}};$('settings').onclick=()=>{if($('home').hidden)$('back').click();const p=$('settingsPanel');p.hidden=!p.hidden;$('settings').setAttribute('aria-expanded',String(!p.hidden))};$('search').oninput=render;$('share').onclick=async()=>{const text=$('title').value+'\n'+$('body').value;try{if(navigator.share)await navigator.share({text});else await navigator.clipboard.writeText(text)}catch(e){}};$('backup').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(notes)],{type:'application/json'}));a.download='notes-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const obj=JSON.parse(await $('file').files[0].text());if(!obj||typeof obj!=='object'||Array.isArray(obj)||!Object.values(obj).every(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&typeof n.body==='string'&&Number.isFinite(n.updated)))throw Error();for(const n of Object.values(obj)){if(!notes[n.id]||notes[n.id].updated<n.updated)notes[n.id]={...n,pending:true}}persist();render();window.queueSync?.()}catch(e){alert('קובץ גיבוי לא תקין')}};$('update').onclick=async()=>{try{if(!navigator.onLine)throw Error();const r=await navigator.serviceWorker.getRegistration();await r?.update();location.reload()}catch(e){alert('יש להתחבר לאינטרנט לעדכון')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{$('status').textContent='התקנת מצב לא מקוון נכשלה'});render();
window.notesBridge={get:()=>notes,merge:n=>{const old=notes[n.id];if(!old||(!old.pending&&n.updated>=old.updated)||n.updated>old.updated){if(active===n.id&&old?.pending)return;notes[n.id]={...n,pending:false};persist();render();if(active===n.id&&!n.deleted)openNote(n.id)}},ack:(id,t)=>{if(notes[id]?.updated===t){notes[id].pending=false;persist()}},status:t=>$('status').textContent=t};
$('login').onclick=()=>{if(!navigator.onLine){alert('חיבור ראשוני לענן מצריך אינטרנט');return}import('./cloud.js').then(m=>m.login()).catch(()=>{$('status').textContent='לא ניתן להתחבר לענן'})};if(navigator.onLine)import('./cloud.js').catch(()=>{});window.addEventListener('online',()=>import('./cloud.js').then(()=>window.queueSync?.()).catch(()=>{}));window.addEventListener('offline',()=>$('status').textContent='לא מקוון • שמירה במכשיר');

let strokes=[], current=null;
const canvas=$('inkCanvas'),ctx=canvas.getContext('2d');
function renderInk(){const box=$('inkList');box.replaceChildren();if(!active)return;for(const [i,st] of (notes[active].ink||[]).entries()){const img=document.createElement('canvas');img.width=900;img.height=Array.isArray(st)?900:st.height;img.className='inkPreview';paint(img.getContext('2d'),Array.isArray(st)?st:st.strokes);const b=document.createElement('button');b.textContent='מחק שרטוט';b.onclick=()=>{if(confirm('למחוק את השרטוט?')){notes[active].ink.splice(i,1);change();renderInk()}};box.append(img,b)}}
function paint(c,ss){const H=c.canvas.height;c.clearRect(0,0,900,H);c.fillStyle='#fff';c.fillRect(0,0,900,H);c.strokeStyle='rgba(0,0,0,0.20)';c.lineWidth=2;c.beginPath();for(let i=90;i<900;i+=90){c.moveTo(i,0);c.lineTo(i,H)}for(let i=90;i<H;i+=90){c.moveTo(0,i);c.lineTo(900,i)}c.stroke();c.strokeStyle='#222';c.lineWidth=4;c.lineCap='round';c.lineJoin='round';for(const p of ss){if(!p.length)continue;c.beginPath();c.moveTo(p[0][0],p[0][1]);for(const q of p.slice(1))c.lineTo(q[0],q[1]);if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()}}
function redrawInk(){paint(ctx,current?[...strokes,current]:strokes)}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function simplify(p,e){if(p.length<3)return p;const a=p[0],b=p.at(-1),dx=b[0]-a[0],dy=b[1]-a[1];let max=0,j=0;for(let i=1;i<p.length-1;i++){const q=p[i],t=Math.max(0,Math.min(1,((q[0]-a[0])*dx+(q[1]-a[1])*dy)/(dx*dx+dy*dy||1))),d=dist(q,[a[0]+t*dx,a[1]+t*dy]);if(d>max){max=d;j=i}}return max>e?[...simplify(p.slice(0,j+1),e).slice(0,-1),...simplify(p.slice(j),e)]:[a,b]}
function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*900/r.width,(e.clientY-r.top)*canvas.height/r.height]}
let pendingTap=null,tapTimer=null,inkPointer=null;
function flushTap(){clearTimeout(tapTimer);tapTimer=null;if(pendingTap){historyInk.push(strokes.slice());strokes.push([pendingTap.p]);pendingTap=null;redrawInk()}}
function cancelTap(){clearTimeout(tapTimer);tapTimer=null;pendingTap=null}
function alignDrawing(){cancelTap();if(!strokes.length)return;historyInk.push(strokes.slice());strokes=strokes.map(straightenInk);redrawInk()}
canvas.onpointerdown=e=>{if(current||e.button>0)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);inkPointer=e.pointerId;current=[point(e)];inkStart=Date.now();redrawInk()};
canvas.onpointermove=e=>{if(!current||e.pointerId!==inkPointer)return;e.preventDefault();current.push(point(e));redrawInk()};
canvas.onpointerup=e=>{if(!current||e.pointerId!==inkPointer)return;e.preventDefault();current.push(point(e));const p=current;current=null;inkPointer=null;const scale=900/canvas.getBoundingClientRect().width;const isTap=Date.now()-inkStart<350&&p.every(q=>dist(q,p[0])<9*scale);
 if(isTap){const now=Date.now();if(pendingTap&&now-pendingTap.time<=400&&dist(p[0],pendingTap.p)<40*scale){alignDrawing()}else{flushTap();pendingTap={p:p[0],time:now};tapTimer=setTimeout(flushTap,410)}}else{flushTap();historyInk.push(strokes.slice());strokes.push(p)}
 redrawInk()};
canvas.onpointercancel=e=>{if(e.pointerId===inkPointer){current=null;inkPointer=null;redrawInk()}};
$('undoInk').onclick=()=>{cancelTap();if(historyInk.length)strokes=historyInk.pop();else strokes.pop();redrawInk()};$('clearInk').onclick=()=>{cancelTap();strokes=[];historyInk=[];redrawInk()};$('inkOpen').onclick=()=>{cancelTap();document.activeElement?.blur();strokes=[];historyInk=[];$('inkDialog').showModal();fitInkCanvas();redrawInk()};$('closeInk').onclick=()=>{cancelTap();$('inkDialog').close()};$('saveInk').onclick=()=>{flushTap();if(!strokes.length)return;if(!active){const id=crypto.randomUUID();notes[id]={id,title:'כתב יד ושרטוט',body:'',updated:Date.now(),pinned:false,pending:true};openNote(id)}(notes[active].ink??=[]).push({height:canvas.height,strokes});change();renderInk();$('inkDialog').close()};


let historyInk=[],inkStart=0,inkMove=0;
function fitInkCanvas(){const r=canvas.getBoundingClientRect();if(r.width>0&&r.height>0){canvas.height=Math.max(90,Math.round(900*r.height/r.width));redrawInk()}}
function straightenInk(p){
 if(p.length<2)return p;
 const a=p[0],b=p.at(-1),d=dist(a,b),len=p.slice(1).reduce((sum,q,i)=>sum+dist(q,p[i]),0);
 if(len<12)return p;
 const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),size=Math.hypot(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
 const closed=d<Math.max(12,size*.12)&&len>size*1.8;
 let v;
 if(!closed&&d>size*.65&&len<d*1.65){v=[a.slice(),b.slice()]}
 else {v=simplify(closed?[...p.slice(0,-1),a]:p,Math.max(8,size*.055)).map(q=>q.slice());if(closed&&v.length<4)return p;}
 if(v.length===2){const dx=v[1][0]-v[0][0],dy=v[1][1]-v[0][1],angle=Math.atan2(dy,dx),snap=Math.round(angle/(Math.PI/4))*(Math.PI/4);if(Math.abs(angle-snap)<Math.PI/12){const l=Math.hypot(dx,dy);v[1]=[v[0][0]+l*Math.cos(snap),v[0][1]+l*Math.sin(snap)]}return v}
 // Keep corners and original topology; each segment between them is straight.
 return v;
}
