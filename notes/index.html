<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffe38a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>פתקים</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf0;color:#24221b;font:17px Arial}main{max-width:750px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between}h1{margin:10px 0;font-size:29px}button,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px;background:#eee9dc;cursor:pointer}button.primary{background:#ffdc63;font-weight:bold}input,textarea{width:100%;border:1px solid #ded6c5;border-radius:10px;padding:12px;background:white;margin:8px 0}textarea{min-height:40vh;resize:vertical}article{background:#fff0b9;border-radius:12px;padding:15px;margin:9px 0;cursor:pointer;overflow-wrap:anywhere}article p{white-space:pre-wrap;margin:8px 0;max-height:4em;overflow:hidden}small{color:#666}nav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}[hidden]{display:none!important}.noteLine{display:block;width:100%;min-height:32px;height:32px;overflow:hidden;resize:none;border:0;border-radius:0;margin:0;padding:5px 2px;line-height:1.4;background:transparent;outline:none;touch-action:manipulation}.noteLine.marked{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}</style><main><header><h1>📝 פתקים</h1><button id="add" class="primary">＋ פתק חדש</button><button id="settings" aria-label="הגדרות" aria-expanded="false" style="font-size:21px;padding:5px 9px;background:transparent;margin-right:auto">⚙</button></header><small id="status">שמירה במכשיר</small><section id="home"><input id="search" placeholder="חיפוש בפתקים"><nav id="settingsPanel" hidden><button id="login">חיבור Ofer Cloud</button><button id="backup">גיבוי</button><button id="restore">שחזור</button><button id="update">בדוק עדכון</button></nav><div id="list"></div></section><section id="editor" hidden><nav><button id="back">חזרה</button><button id="pin">נעיצה</button><button id="share">שיתוף</button><button id="del">מחיקה</button></nav><input id="title" placeholder="כותרת"><textarea id="body" hidden></textarea><div id="lines" style="background:white;border:1px solid #ded6c5;border-radius:10px;padding:10px;min-height:40vh;margin:8px 0"></div><small>הקשה כפולה על שורה מוסיפה או מסירה קו תחתון</small><small id="saved"></small></section><input type="file" id="file" accept=".json" hidden></main><script>
const $=id=>document.getElementById(id),key='ofer-notes-v1';let notes={},active=null;try{notes=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){$('status').textContent='שגיאה בקריאת הנתונים'}
function persist(){try{localStorage.setItem(key,JSON.stringify(notes));$('saved').textContent='✓ נשמר במכשיר';return true}catch(e){$('status').textContent='שגיאת שמירה במכשיר';return false}}
function render(){const q=$('search').value.toLowerCase();$('list').replaceChildren();const rows=Object.values(notes).filter(n=>!n.deleted&&(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updated-a.updated);for(const n of rows){const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),d=document.createElement('small');h.textContent=(n.pinned?'📌 ':'')+(n.title||'ללא כותרת');p.textContent=n.body;d.textContent=new Date(n.updated).toLocaleString('he-IL');a.append(h,p,d);a.onclick=()=>openNote(n.id);$('list').append(a)}if(!rows.length)$('list').textContent='אין פתקים להצגה'}
function openNote(id){active=id;const n=notes[id];$('title').value=n.title;$('body').value=n.body;drawLines(n);$('pin').textContent=n.pinned?'בטל נעיצה':'נעיצה';$('home').hidden=true;$('editor').hidden=false}
function drawLines(n,focus=-1,pos=0){const box=$('lines');box.replaceChildren();const lines=n.body.split('\n');lines.forEach((line,i)=>{const t=document.createElement('textarea');t.className='noteLine'+(n.underlined?.includes(i)?' marked':'');t.rows=1;t.value=line;t.placeholder=i===0?'כתוב כאן...':'';box.append(t);const resize=()=>{t.style.height='0px';t.style.height=Math.max(32,t.scrollHeight)+'px'};requestAnimationFrame(resize);let last=0,lastToggle=0;const toggle=()=>{const a=notes[active];if(!a)return;const set=new Set(a.underlined||[]);set.has(i)?set.delete(i):set.add(i);a.underlined=[...set];t.classList.toggle('marked',set.has(i));change()};t.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;const now=Date.now();if(now-last<350){last=0;lastToggle=now;toggle()}else last=now});t.addEventListener('dblclick',e=>{if(Date.now()-lastToggle<500||Date.now()-last<350||e.sourceCapabilities?.firesTouchEvents)return;toggle()});t.oninput=()=>{const a=notes[active],parts=t.value.split('\n');if(parts.length===1){lines[i]=t.value;$('body').value=lines.join('\n');change();resize();return}const cursor=t.selectionStart, prefix=t.value.slice(0,cursor).split('\n');lines.splice(i,1,...parts);a.underlined=(a.underlined||[]).map(x=>x>i?x+parts.length-1:x);$('body').value=lines.join('\n');change();drawLines(a,i+prefix.length-1,prefix.at(-1).length)};t.onkeydown=e=>{if(e.key==='Backspace'&&i>0&&t.selectionStart===0&&t.selectionEnd===0){e.preventDefault();const a=notes[active],p=lines[i-1].length;lines.splice(i-1,2,lines[i-1]+lines[i]);a.underlined=[...new Set((a.underlined||[]).map(x=>x>=i?x-1:x))];$('body').value=lines.join('\n');change();drawLines(a,i-1,p)}};if(i===focus){t.focus();t.setSelectionRange(pos,pos)}})}
function change(){if(!active)return;Object.assign(notes[active],{title:$('title').value,body:$('body').value,updated:Date.now(),pending:true});if(persist())window.queueSync?.()}
$('title').oninput=$('body').oninput=change;$('add').onclick=()=>{const id=crypto.randomUUID();notes[id]={id,title:'',body:'',updated:Date.now(),pinned:false,pending:true};persist();openNote(id);$('title').focus();window.queueSync?.()};$('back').onclick=()=>{active=null;$('editor').hidden=true;$('home').hidden=false;render()};$('pin').onclick=()=>{notes[active].pinned=!notes[active].pinned;$('pin').textContent=notes[active].pinned?'בטל נעיצה':'נעיצה';change()};$('del').onclick=()=>{if(confirm('למחוק את הפתק?')){notes[active].deleted=true;change();$('back').click()}};$('settings').onclick=()=>{if($('home').hidden)$('back').click();const p=$('settingsPanel');p.hidden=!p.hidden;$('settings').setAttribute('aria-expanded',String(!p.hidden))};$('search').oninput=render;$('share').onclick=async()=>{const text=$('title').value+'\n'+$('body').value;try{if(navigator.share)await navigator.share({text});else await navigator.clipboard.writeText(text)}catch(e){}};$('backup').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(notes)],{type:'application/json'}));a.download='notes-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const obj=JSON.parse(await $('file').files[0].text());if(!obj||typeof obj!=='object'||Array.isArray(obj)||!Object.values(obj).every(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&typeof n.body==='string'&&Number.isFinite(n.updated)))throw Error();for(const n of Object.values(obj)){if(!notes[n.id]||notes[n.id].updated<n.updated)notes[n.id]={...n,pending:true}}persist();render();window.queueSync?.()}catch(e){alert('קובץ גיבוי לא תקין')}};$('update').onclick=async()=>{try{if(!navigator.onLine)throw Error();const r=await navigator.serviceWorker.getRegistration();await r?.update();location.reload()}catch(e){alert('יש להתחבר לאינטרנט לעדכון')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{$('status').textContent='התקנת מצב לא מקוון נכשלה'});render();
window.notesBridge={get:()=>notes,merge:n=>{const old=notes[n.id];if(!old||(!old.pending&&n.updated>=old.updated)||n.updated>old.updated){if(active===n.id&&old?.pending)return;notes[n.id]={...n,pending:false};persist();render();if(active===n.id&&!n.deleted)openNote(n.id)}},ack:(id,t)=>{if(notes[id]?.updated===t){notes[id].pending=false;persist()}},status:t=>$('status').textContent=t};
$('login').onclick=()=>{if(!navigator.onLine){alert('חיבור ראשוני לענן מצריך אינטרנט');return}import('./cloud.js').then(m=>m.login()).catch(()=>{$('status').textContent='לא ניתן להתחבר לענן'})};if(navigator.onLine)import('./cloud.js').catch(()=>{});window.addEventListener('online',()=>import('./cloud.js').then(()=>window.queueSync?.()).catch(()=>{}));window.addEventListener('offline',()=>$('status').textContent='לא מקוון • שמירה במכשיר');
</script></html>
