 const h=[],v=[];for(let i=0;i<out.length;i++){const p=out[i];if(p.length!==2)continue;const [a,b]=p,dx=Math.abs(a[0]-b[0]),dy=Math.abs(a[1]-b[1]);if(dx>55&&dy<dx*.18)h.push({i,y:(a[1]+b[1])/2,x:Math.min(a[0],b[0]),X:Math.max(a[0],b[0])});if(dy>55&&dx<dy*.18)v.push({i,x:(a[0]+b[0])/2,y:Math.min(a[1],b[1]),Y:Math.max(a[1],b[1])})}
 for(let i=0;i<h.length;i++)for(let j=i+1;j<h.length;j++){const a=h[i],b=h[j],y=Math.min(a.y,b.y),Y=Math.max(a.y,b.y);if(Y-y<55)continue;const tol=Math.max(20,Math.min(55,(Y-y)*.16));if(Math.abs(a.x-b.x)>tol||Math.abs(a.X-b.X)>tol)continue;const l=v.find(c=>Math.abs(c.x-(a.x+b.x)/2)<tol&&Math.abs(c.y-y)<tol&&Math.abs(c.Y-Y)<tol),rr=v.find(c=>Math.abs(c.x-(a.X+b.X)/2)<tol&&Math.abs(c.y-y)<tol&&Math.abs(c.Y-Y)<tol);if(!l||!rr||l.i===rr.i)continue;addFrame(l.x,y,rr.x,Y,[a.i,b.i,l.i,rr.i]);}
 frames.sort((a,b)=>(a.X-a.x)*(a.Y-a.y)-(b.X-b.x)*(b.Y-b.y));
 const protectedIds=new Set(frames.flatMap(f=>f.ids));
 for(const f of frames){if(f.ids.length===4){for(const i of f.ids){const p=out[i],a=p[0],b=p[1];if(Math.abs(a[0]-b[0])>Math.abs(a[1]-b[1])){const y=Math.abs((a[1]+b[1])/2-f.y)<Math.abs((a[1]+b[1])/2-f.Y)?f.y:f.Y;out[i]=[[f.x,y],[f.X,y]]}else{const x=Math.abs((a[0]+b[0])/2-f.x)<Math.abs((a[0]+b[0])/2-f.X)?f.x:f.X;out[i]=[[x,f.y],[x,f.Y]]}}}}
 // Clip only lines mostly inside a recognized frame, with short overshoots.
 for(let i=0;i<out.length;i++){if(protectedIds.has(i)||out[i].length!==2)continue;const [a,b]=out[i],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len<20)continue;
 for(const f of frames){let lo=0,hi=1,ok=true;for(const [p,q] of [[-dx,a[0]-f.x],[dx,f.X-a[0]],[-dy,a[1]-f.y],[dy,f.Y-a[1]]]){if(Math.abs(p)<1e-8){if(q<0)ok=false;continue}const t=q/p;if(p<0)lo=Math.max(lo,t);else hi=Math.min(hi,t)}if(!ok||hi<=lo||hi-lo<.70)continue;const tol=Math.min(65,Math.max(22,Math.min(f.X-f.x,f.Y-f.y)*.20));if(lo*len>tol||(1-hi)*len>tol)continue;if(lo>0||hi<1){out[i]=[[a[0]+lo*dx,a[1]+lo*dy],[a[0]+hi*dx,a[1]+hi*dy]];break}}
 }
 return out;
}

function setMoveMode(on){moveMode=on;const b=$('moveInk');b.classList.toggle('primary',on);b.setAttribute('aria-pressed',String(on));b.textContent=on?'הזז ✓':'הזז';canvas.style.cursor=on?'grab':'crosshair';}
$('moveInk').onclick=()=>{flushTap();setMoveMode(!moveMode)};
function segmentDistance(p,a,b){const x=b[0]-a[0],y=b[1]-a[1],d=x*x+y*y,t=d?Math.max(0,Math.min(1,((p[0]-a[0])*x+(p[1]-a[1])*y)/d)):0;return dist(p,[a[0]+t*x,a[1]+t*y])}
function findInk(p,tol){let best=-1,min=tol;for(let i=strokes.length-1;i>=0;i--){const path=strokes[i];for(let j=0;j<path.length;j++){const d=segmentDistance(p,path[j],path[Math.max(0,j-1)]);if(d<min){min=d;best=i}}}return best}
function beginDrag(e){e.preventDefault();const p=point(e),i=findInk(p,18*900/canvas.getBoundingClientRect().width);if(i<0)return;canvas.setPointerCapture(e.pointerId);dragInk={i,p,pointer:e.pointerId,before:strokes.slice(),source:strokes[i].map(q=>q.slice())};redrawInk()}
function updateDrag(e){if(e.pointerId!==dragInk.pointer)return;e.preventDefault();const p=point(e),d=dragInk,src=d.source;let dx=p[0]-d.p[0],dy=p[1]-d.p[1];const xs=src.map(q=>q[0]),ys=src.map(q=>q[1]);dx=Math.max(-Math.min(...xs),Math.min(900-Math.max(...xs),dx));dy=Math.max(-Math.min(...ys),Math.min(canvas.height-Math.max(...ys),dy));strokes[d.i]=src.map(q=>[q[0]+dx,q[1]+dy]);redrawInk()}
function finishDrag(e){if(e.pointerId!==dragInk.pointer)return;updateDrag(e);if(JSON.stringify(strokes[dragInk.i])!==JSON.stringify(dragInk.source))historyInk.push(dragInk.before);dragInk=null;redrawInk()}

let findMatches=[],findIndex=0,homeMatch=0,homeMatches=[],gesture=null,lastFindTap=null,lastFindAdvance=0;
function rangesOf(text,q){const out=[];if(!q)return out;const a=text.toLowerCase(),b=q.toLowerCase();for(let i=0;(i=a.indexOf(b,i))!==-1;i+=Math.max(1,b.length))out.push(i);return out}
function paintMatch(el,text,start,length){el.replaceChildren();if(start<0){el.textContent=text;return}el.append(document.createTextNode(text.slice(0,start)));const m=document.createElement('mark');m.textContent=text.slice(start,start+length);el.append(m,document.createTextNode(text.slice(start+length)))}
function closeNoteFind(){if(!$('noteFind'))return;$('noteFind').hidden=true;$('noteQuery').value='';document.body.classList.remove('finding');document.querySelectorAll('.findMirror').forEach(e=>e.remove());lastFindTap=null}
function openNoteFind(){if(!$('noteFind').hidden)return;document.activeElement?.blur();$('noteFind').hidden=false;document.body.classList.add('finding');for(const t of $('lines').querySelectorAll('.noteLine')){const m=document.createElement('div');m.className='findMirror';m.textContent=t.value;t.after(m)}findIndex=0;paintNoteFind();$('noteQuery').focus()}
function paintNoteFind(scroll=true){const q=$('noteQuery').value;const fields=[...$('lines').querySelectorAll('.noteLine')],mirrors=[...$('lines').querySelectorAll('.findMirror')];findMatches=[];fields.forEach((t,i)=>{for(const at of rangesOf(t.value,q))findMatches.push({i,at})});if(findIndex>=findMatches.length)findIndex=0;const hit=findMatches[findIndex];mirrors.forEach((m,i)=>paintMatch(m,fields[i].value,hit?.i===i?hit.at:-1,q.length));$('findCount').textContent=q?(hit?(findIndex+1)+' מתוך '+findMatches.length:'אין תוצאות'):'';if(scroll&&hit)mirrors[hit.i]?.querySelector('mark')?.scrollIntoView({block:'center',behavior:'smooth'})}
$('noteQuery').oninput=()=>{findIndex=0;paintNoteFind()};$('findClose').onclick=closeNoteFind;
function paintHomeFind(scroll=false){const q=$('search').value;homeMatches=[];const articles=[...$('list').querySelectorAll('article')];for(const a of articles){const n=notes[a.dataset.noteId];for(const [el,txt] of [[a.querySelector('strong'),(n.pinned?'📌 ':'')+(n.title||'')],[a.querySelector('p'),n.body]]){el.textContent=txt;for(const at of rangesOf(txt,q))homeMatches.push({el,txt,at})}}if(homeMatch>=homeMatches.length)homeMatch=0;const hit=homeMatches[homeMatch];if(hit){paintMatch(hit.el,hit.txt,hit.at,q.length);hit.el.style.maxHeight='none';if(scroll)hit.el.querySelector('mark')?.scrollIntoView({block:'center',behavior:'smooth'})}$('homeFindCount').textContent=q?(hit?(homeMatch+1)+' מתוך '+homeMatches.length:'אין תוצאות'):''}
function nextFind(){if(Date.now()-lastFindAdvance<300)return;lastFindAdvance=Date.now();if(active&&!$('noteFind').hidden&&findMatches.length){findIndex=(findIndex+1)%findMatches.length;paintNoteFind()}else if(!active&&!$('search').hidden&&homeMatches.length){homeMatch=(homeMatch+1)%homeMatches.length;paintHomeFind(true)}}
function searching(){return active?!$('noteFind').hidden:!$('search').hidden}
document.addEventListener('touchstart',e=>{if(e.touches.length!==1||$('inkDialog').open||e.target.closest('input,button,dialog')){gesture=null;return}const p=e.touches[0];gesture={x:p.clientX,y:p.clientY,t:Date.now(),top:window.scrollY<=5}},{passive:true,capture:true});
document.addEventListener('touchend',e=>{if(!gesture)return;const g=gesture;gesture=null;const p=e.changedTouches[0],dx=p.clientX-g.x,dy=p.clientY-g.y;if(dy>65&&Math.abs(dx)<dy*.55&&g.top){if(active)openNoteFind();else{$('search').hidden=false;$('homeFindCount').hidden=false;$('search').focus();paintHomeFind()}lastFindTap=null;return}if(searching()&&Math.hypot(dx,dy)<18&&Date.now()-g.t<400){const now=Date.now();if(lastFindTap&&now-lastFindTap.t<400&&Math.hypot(p.clientX-lastFindTap.x,p.clientY-lastFindTap.y)<55){e.preventDefault();e.stopPropagation();lastFindTap=null;nextFind()}else lastFindTap={t:now,x:p.clientX,y:p.clientY}}},{passive:false,capture:true});
document.addEventListener('dblclick',e=>{if(searching()&&!e.target.closest('input,button,dialog')){e.preventDefault();e.stopPropagation();nextFind()}},true);
</script></html>
