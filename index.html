<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#086a48"><title>מכירות יומי</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f2f7f3;color:#173428}header{background:#096747;color:white;text-align:center;padding:20px 12px}h1{margin:0 0 14px;font-size:27px}.days{display:flex;align-items:center;justify-content:center;gap:22px}.days button{background:#ffffff22;border:1px solid #ffffff88;color:white;font-size:28px;border-radius:12px;width:54px;height:44px}.days strong{font-size:22px;direction:ltr}.wrap{max-width:720px;margin:auto;padding:17px 15px 55px}h2{font-size:19px;margin:20px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}.item{min-width:0}label{display:block;font-weight:bold;font-size:16px;margin:0 0 7px}input,select{width:100%;min-width:0;max-width:100%;font-size:20px;font-weight:bold;background:#eef8f0;border:2px solid #bbdaca;color:#16382c;border-radius:12px;padding:13px 10px;text-align:right}input[type=date]{font-size:16px;width:70%;min-width:0;direction:ltr;display:block;margin-right:0;margin-left:auto}.total{display:flex;align-items:center;justify-content:space-between;background:#064832;color:white;border-radius:14px;padding:18px 14px;margin:19px 0;font-size:21px;font-weight:bold}.total output{font-size:29px;direction:ltr}.full{grid-column:1/-1}.arLabel{font-size:.70em;font-weight:500;white-space:normal;display:inline;unicode-bidi:isolate}button.roundSave{display:block;width:94px;height:94px;border-radius:50%;border:0;background:#1769d2;color:#fff;font-size:21px;font-weight:700;margin:18px auto 8px;box-shadow:0 4px 12px #1769d244;cursor:pointer} .editActions{display:flex;gap:8px;justify-content:center;margin:10px 0 16px;flex-wrap:wrap}.editActions[hidden]{display:none}.editActions button{border:1px solid #b8d7cb;background:#fff;color:#174333;padding:12px 16px;font-size:16px;border-radius:10px;font-weight:bold}.editActions button.danger{color:#b22121;border-color:#e8b6b6}.editToggle{display:block;margin:8px auto 16px;padding:12px 20px;background:#fff;border:2px solid #a0c7bf;border-radius:12px;color:#084734;font-size:18px;font-weight:700;cursor:pointer} .saveToast{position:fixed;z-index:1000;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 26px;border-radius:15px;background:#ffdf55;color:#122e24;box-shadow:0 8px 35px #0004;font-size:23px;font-weight:800;text-align:center;min-width:230px;pointer-events:none} .saveToast[hidden]{display:none}button.action{width:100%;border:0;border-radius:14px;padding:17px 10px;font-size:20px;font-weight:bold;margin-top:12px;cursor:pointer}.green{background:#008252;color:white}.yellow{background:#ffdd58;color:#242000}.muted{font-size:13px;opacity:.85;margin-top:9px;text-align:center}.notice{background:#fff1c7;border:1px solid #dfbd63;border-radius:10px;padding:10px;margin-top:13px;display:none} @media(max-width:365px){label{font-size:14px}input{font-size:18px}.wrap{padding:13px 10px}}</style></head>
<body><header><h1>מכירות יומי</h1><div class="days"><button type="button" id="prev" aria-label="יום קודם">❯</button><strong id="headerDate"></strong><button type="button" id="next" aria-label="יום הבא">❮</button></div></header>
<main class="wrap"><h2>פרטי הדוח</h2><div class="grid"><div class="item"><label for="date">תאריך <small class="arLabel" lang="ar" dir="rtl">التاريخ</small></label><input type="date" id="date"></div><div class="item"><label for="employee">שם העובד <small class="arLabel" lang="ar" dir="rtl">اسم الموظف</small></label><input id="employee" placeholder="שם מלא" autocomplete="name"></div><div class="item full"><label for="station">בחירת תחנה <small class="arLabel" lang="ar" dir="rtl">اختيار المحطة</small></label><select id="station"><option value="">בחר תחנה</option><option>מנדלבאום</option><option>ענבים</option></select></div></div>
<h2>נתוני מכירות ותחנה</h2><div class="grid">
<div class="item"><label for="diesel">1. מכירות סולר <small class="arLabel" lang="ar" dir="rtl">مبيعات السولار</small></label><input id="diesel" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="gas">2. מכירות בנזין <small class="arLabel" lang="ar" dir="rtl">مبيعات البنزين</small></label><input id="gas" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="urea">3. מכירות אוריאה <small class="arLabel" lang="ar" dir="rtl">مبيعات اليوريا</small></label><input id="urea" type="number" inputmode="decimal" placeholder="0"></div>
<div class="total full"><span>4. ס״ה מכירות (אוטומטי) <small class="arLabel" lang="ar" dir="rtl">إجمالي المبيعات (تلقائي)</small></span><output id="total">0</output></div>
<div class="item"><label for="washer">5. נוזל שמשות <small class="arLabel" lang="ar" dir="rtl">سائل مسّاحات الزجاج</small></label><input id="washer" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="oils">6. ס״ה שמנים <small class="arLabel" lang="ar" dir="rtl">إجمالي الزيوت</small></label><input id="oils" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="workers">7. מכירות עובדים <small class="arLabel" lang="ar" dir="rtl">مبيعات الموظفين</small></label><input id="workers" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="safe">8. קמפיוסייף <small class="arLabel" lang="ar" dir="rtl">كامبيوسيف</small></label><input id="safe" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="ureaMeter">9. מונה אוריאה <small class="arLabel" lang="ar" dir="rtl">عداد اليوريا</small></label><input id="ureaMeter" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="shortages">10. חוסרים <small class="arLabel" lang="ar" dir="rtl">العجز</small></label><input id="shortages" type="number" inputmode="decimal" placeholder="0"></div></div>
<h2>מיכלית סולר <small class="arLabel" lang="ar" dir="rtl">صهريج سولار</small></h2>
<div class="grid"><div class="item"><label for="dieselDoc">מספר תעודה <small class="arLabel" lang="ar" dir="rtl">رقم المستند</small></label><input id="dieselDoc" type="text" inputmode="numeric" placeholder="מספר תעודה"></div>
<div class="item"><label for="dieselTankQty">כמות <small class="arLabel" lang="ar" dir="rtl">الكمية</small></label><input id="dieselTankQty" type="number" inputmode="decimal" step="any" placeholder="0"></div></div>
<h2>מיכלית בנזין <small class="arLabel" lang="ar" dir="rtl">صهريج بنزين</small></h2>
<div class="grid"><div class="item"><label for="gasDoc">מספר תעודה <small class="arLabel" lang="ar" dir="rtl">رقم المستند</small></label><input id="gasDoc" type="text" inputmode="numeric" placeholder="מספר תעודה"></div>
<div class="item"><label for="gasTankQty">כמות <small class="arLabel" lang="ar" dir="rtl">الكمية</small></label><input id="gasTankQty" type="number" inputmode="decimal" step="any" placeholder="0"></div></div>
<h2>עובדים <small class="arLabel" lang="ar" dir="rtl">الموظفون</small></h2>
<div class="grid">
<div class="item"><label for="morningWorker">בוקר <small class="arLabel" lang="ar" dir="rtl">صباح</small></label><input id="morningWorker" type="text" placeholder="שם העובד"></div>
<div class="item"><label for="afternoonWorker">צהריים <small class="arLabel" lang="ar" dir="rtl">مساء</small></label><input id="afternoonWorker" type="text" placeholder="שם העובד"></div>
<div class="item"><label for="nightWorker">לילה <small class="arLabel" lang="ar" dir="rtl">ليل</small></label><input id="nightWorker" type="text" placeholder="שם העובד"></div>
</div>
<button class="roundSave" id="saveBtn" type="button">שמירה</button><button class="editToggle" id="editToggle" type="button" aria-expanded="false">✏️ עריכה/מחיקה</button><div class="editActions" id="editActions" hidden><button type="button" id="editEntry">✏️ עריכת נתונים</button><button type="button" id="deleteEntry" class="danger">🗑️ מחיקת נתוני היום</button></div><div class="saveToast" id="saveToast" role="status" aria-live="polite" hidden>הנתונים נשמרו</div><button class="action green" id="share">✉️ שליחה במייל (קובץ לאקסל)</button><button class="action yellow" id="download">⬇️ הורדת קובץ לאקסל</button><div id="message" class="notice" role="status"></div><p class="muted">הנתונים נשמרים במכשיר לכל יום בנפרד. אין סיכומים ואין צורך בסיסמה.</p></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),names=['diesel','gas','urea','washer','oils','workers','safe','ureaMeter','shortages'],all=['employee','station',...names,'dieselDoc','dieselTankQty','gasDoc','gasTankQty','morningWorker','afternoonWorker','nightWorker'];const pad=x=>String(x).padStart(2,'0');const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};const human=s=>s? s.substring(8,10)+'/'+s.substring(5,7)+'/'+s.substring(2,4):'';const n=id=>{const x=Number($(id).value);return Number.isFinite(x)?x:0};const sum=()=>n('diesel')+n('gas')+n('urea');const fmt=x=>new Intl.NumberFormat('he-IL',{maximumFractionDigits:2}).format(x);let active=today();const key=d=>'daily-sales-v3:'+d;const update=()=>{$('total').textContent=fmt(sum());$('headerDate').textContent=human(active)};const save=()=>{const a={};for(const id of all)a[id]=$(id).value;try{localStorage.setItem(key(active),JSON.stringify(a));return true}catch(e){return false}};const load=d=>{const oldEmployee=$('employee').value,oldStation=$('station').value;let a={};try{a=JSON.parse(localStorage.getItem(key(d))||'{}')}catch(e){}active=d;$('date').value=d;for(const id of all)$(id).value=a[id]??(id==='employee'?oldEmployee:id==='station'?oldStation:'');update()};const move=x=>{save();const [y,m,d]=active.split('-').map(Number),v=new Date(y,m-1,d+x,12);load(v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate()))};let toastTimer; const showToast=message=>{const t=$('saveToast');t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},2200)}; const closeEdits=()=>{$('editActions').hidden=true;$('editToggle').setAttribute('aria-expanded','false')}; $('saveBtn').onclick=()=>{showToast(save()?'הנתונים נשמרו':'לא ניתן לשמור את הנתונים');closeEdits()}; $('editToggle').onclick=()=>{const open=$('editActions').hidden;$('editActions').hidden=!open;$('editToggle').setAttribute('aria-expanded',String(open))}; $('editEntry').onclick=()=>{closeEdits();$('diesel').focus();$('diesel').scrollIntoView({behavior:'smooth',block:'center'});showToast('ניתן לערוך את הנתונים וללחוץ שמירה')}; $('deleteEntry').onclick=()=>{if(!confirm('למחוק את כל נתוני המכירות לתאריך '+human(active)+'? לא ניתן לשחזר את המחיקה.'))return;try{localStorage.removeItem(key(active));for(const id of all)$(id).value='';update();closeEdits();showToast('נתוני היום נמחקו')}catch(e){showToast('לא ניתן למחוק את הנתונים')}};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('date').onchange=()=>{if($('date').value){save();load($('date').value)}};for(const id of all){$(id).addEventListener('input',()=>{update();save()});$(id).addEventListener('change',()=>{update();save()})}const csv=()=>{const headers=['תאריך','שם העובד','שם התחנה','מכירות סולר','מכירות בנזין','מכירות אוריאה','ס״ה מכירות','נוזל שמשות','ס״ה שמנים','מכירות עובדים','קמפיוסייף','מונה אוריאה','חוסרים','מיכלית סולר - מספר תעודה','מיכלית סולר - כמות','מיכלית בנזין - מספר תעודה','מיכלית בנזין - כמות','עובדים - בוקר','עובדים - צהריים','עובדים - לילה'];const row=[human(active),$('employee').value,$('station').value,n('diesel'),n('gas'),n('urea'),sum(),...names.slice(3).map(n),$('dieselDoc').value,n('dieselTankQty'),$('gasDoc').value,n('gasTankQty'),$('morningWorker').value,$('afternoonWorker').value,$('nightWorker').value];const q=s=>'"'+String(s).replace(/"/g,'""')+'"';return '\ufeff'+headers.map(q).join(',')+'\r\n'+row.map(q).join(',')+'\r\n'};const file=()=>new File([csv()],'daily-sales-'+active+'.csv',{type:'text/csv;charset=utf-8'});const valid=()=>{if(!$('employee').value.trim()||!$('station').value){alert('יש להזין שם עובד ולבחור תחנה');return false}return true};const download=()=>{const blob=new Blob([csv()],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file().name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)};$('download').onclick=()=>{if(valid()){save();download()}};$('share').onclick=async()=>{if(!valid())return;save();const f=file();if(navigator.share&&navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],title:'מכירות יומי - '+$('station').value,text:human(active)});return}catch(e){if(e.name==='AbortError')return}}download();$('message').style.display='block';$('message').textContent='הקובץ הורד. יש לצרף אותו למייל שייפתח.';location.href='mailto:?subject='+encodeURIComponent('מכירות יומי '+$('station').value+' '+human(active))};load(today());})();
</script></body></html>
