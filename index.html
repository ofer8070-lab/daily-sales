<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#086a48"><title>מכירות יומי</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f2f7f3;color:#173428}header{background:#096747;color:white;text-align:center;padding:20px 12px}h1{margin:0 0 14px;font-size:27px}.days{display:flex;align-items:center;justify-content:center;gap:22px}.days button{background:#ffffff22;border:1px solid #ffffff88;color:white;font-size:28px;border-radius:12px;width:54px;height:44px}.days strong{font-size:22px;direction:ltr}.wrap{max-width:720px;margin:auto;padding:17px 15px 55px}h2{font-size:19px;margin:20px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}.item{min-width:0}label{display:block;font-weight:bold;font-size:16px;margin:0 0 7px}input,select{width:100%;min-width:0;max-width:100%;font-size:20px;font-weight:bold;background:#eef8f0;border:2px solid #bbdaca;color:#16382c;border-radius:12px;padding:13px 10px;text-align:right}input[type=date]{font-size:16px;width:70%;min-width:0;direction:ltr;display:block;margin-right:0;margin-left:auto}.total{display:flex;align-items:center;justify-content:space-between;background:#064832;color:white;border-radius:14px;padding:18px 14px;margin:19px 0;font-size:21px;font-weight:bold}.total output{font-size:29px;direction:ltr}.full{grid-column:1/-1}button.action{width:100%;border:0;border-radius:14px;padding:17px 10px;font-size:20px;font-weight:bold;margin-top:12px;cursor:pointer}.green{background:#008252;color:white}.yellow{background:#ffdd58;color:#242000}.muted{font-size:13px;opacity:.85;margin-top:9px;text-align:center}.notice{background:#fff1c7;border:1px solid #dfbd63;border-radius:10px;padding:10px;margin-top:13px;display:none} @media(max-width:365px){label{font-size:14px}input{font-size:18px}.wrap{padding:13px 10px}}</style></head>
<body><header><h1>מכירות יומי</h1><div class="days"><button type="button" id="prev" aria-label="יום קודם">❯</button><strong id="headerDate"></strong><button type="button" id="next" aria-label="יום הבא">❮</button></div></header>
<main class="wrap"><h2>פרטי הדוח</h2><div class="grid"><div class="item"><label for="date">תאריך</label><input type="date" id="date"></div><div class="item"><label for="employee">שם העובד</label><input id="employee" placeholder="שם מלא" autocomplete="name"></div><div class="item full"><label for="station">בחירת תחנה</label><select id="station"><option value="">בחר תחנה</option><option>מנדלבאום</option><option>ענבים</option></select></div></div>
<h2>נתוני מכירות ותחנה</h2><div class="grid">
<div class="item"><label for="diesel">1. מכירות סולר</label><input id="diesel" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="gas">2. מכירות בנזין</label><input id="gas" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="urea">3. מכירות אוריאה</label><input id="urea" type="number" inputmode="decimal" placeholder="0"></div>
<div class="total full"><span>4. ס״ה מכירות (אוטומטי)</span><output id="total">0</output></div>
<div class="item"><label for="washer">5. נוזל שמשות</label><input id="washer" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="oils">6. ס״ה שמנים</label><input id="oils" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="workers">7. מכירות עובדים</label><input id="workers" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="safe">8. קמפיוסייף</label><input id="safe" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="ureaMeter">9. מונה אוריאה</label><input id="ureaMeter" type="number" inputmode="decimal" placeholder="0"></div>
<div class="item"><label for="shortages">10. חוסרים</label><input id="shortages" type="number" inputmode="decimal" placeholder="0"></div></div>
<button class="action green" id="share">✉️ שליחה במייל (קובץ לאקסל)</button><button class="action yellow" id="download">⬇️ הורדת קובץ לאקסל</button><div id="message" class="notice" role="status"></div><p class="muted">הנתונים נשמרים במכשיר לכל יום בנפרד. אין סיכומים ואין צורך בסיסמה.</p></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),names=['diesel','gas','urea','washer','oils','workers','safe','ureaMeter','shortages'],all=['employee','station',...names];const pad=x=>String(x).padStart(2,'0');const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};const human=s=>s? s.substring(8,10)+'/'+s.substring(5,7)+'/'+s.substring(2,4):'';const n=id=>{const x=Number($(id).value);return Number.isFinite(x)?x:0};const sum=()=>n('diesel')+n('gas')+n('urea');const fmt=x=>new Intl.NumberFormat('he-IL',{maximumFractionDigits:2}).format(x);let active=today();const key=d=>'daily-sales-v3:'+d;const update=()=>{$('total').textContent=fmt(sum());$('headerDate').textContent=human(active)};const save=()=>{const a={};for(const id of all)a[id]=$(id).value;try{localStorage.setItem(key(active),JSON.stringify(a))}catch(e){}};const load=d=>{const oldEmployee=$('employee').value,oldStation=$('station').value;let a={};try{a=JSON.parse(localStorage.getItem(key(d))||'{}')}catch(e){}active=d;$('date').value=d;for(const id of all)$(id).value=a[id]??(id==='employee'?oldEmployee:id==='station'?oldStation:'');update()};const move=x=>{save();const [y,m,d]=active.split('-').map(Number),v=new Date(y,m-1,d+x,12);load(v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate()))};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('date').onchange=()=>{if($('date').value){save();load($('date').value)}};for(const id of all){$(id).addEventListener('input',()=>{update();save()});$(id).addEventListener('change',()=>{update();save()})}const csv=()=>{const headers=['תאריך','שם העובד','שם התחנה','מכירות סולר','מכירות בנזין','מכירות אוריאה','ס״ה מכירות','נוזל שמשות','ס״ה שמנים','מכירות עובדים','קמפיוסייף','מונה אוריאה','חוסרים'];const row=[human(active),$('employee').value,$('station').value,n('diesel'),n('gas'),n('urea'),sum(),...names.slice(3).map(n)];const q=s=>'"'+String(s).replace(/"/g,'""')+'"';return '\ufeff'+headers.map(q).join(',')+'\r\n'+row.map(q).join(',')+'\r\n'};const file=()=>new File([csv()],'daily-sales-'+active+'.csv',{type:'text/csv;charset=utf-8'});const valid=()=>{if(!$('employee').value.trim()||!$('station').value){alert('יש להזין שם עובד ולבחור תחנה');return false}return true};const download=()=>{const blob=new Blob([csv()],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file().name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)};$('download').onclick=()=>{if(valid()){save();download()}};$('share').onclick=async()=>{if(!valid())return;save();const f=file();if(navigator.share&&navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],title:'מכירות יומי - '+$('station').value,text:human(active)});return}catch(e){if(e.name==='AbortError')return}}download();$('message').style.display='block';$('message').textContent='הקובץ הורד. יש לצרף אותו למייל שייפתח.';location.href='mailto:?subject='+encodeURIComponent('מכירות יומי '+$('station').value+' '+human(active))};load(today());})();
</script></body></html>
